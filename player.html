<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battlemap — Joueur</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo">⚔️</div>
        <div>
          <div class="title">Battlemap — Joueur</div>
          <div class="subtitle">Vue temps réel. Par défaut tu suis la caméra du MJ.</div>
        </div>
      </div>
      <div class="pill-row">
        <span class="pill" id="rtStatusPill">Statut : <b id="rtStatus">…</b></span>
      </div>
    </header>

    <div class="content">
      <div class="panel map-canvas player-canvas">
        <div id="turnBar" class="turnbar" aria-label="Ordre des tours"></div>
        <div class="map-canvas-wrap">
          <canvas id="map"></canvas>
        </div>
        <div id="playerTokenPanel" class="player-token-panel">
          <!-- En-tête token -->
          <div class="player-token-header">
            <div id="playerTokenDot" class="player-token-dot"></div>
            <div id="playerTokenName" class="player-token-name">Aucun token assigné</div>
            <div id="playerTokenStatus" class="player-token-status"></div>
          </div>

          <!-- Section PV -->
          <div class="player-hp-section">
            <div class="player-hp-header">
              <span class="player-stat-label">Points de Vie</span>
              <span id="playerHpValue" class="player-hp-text">—</span>
            </div>
            <!-- Barre de PV -->
            <div class="player-hp-bar-wrap">
              <div id="playerHpBarCurrent" class="player-hp-bar-current" style="width:0%"></div>
              <div id="playerHpBarTemp" class="player-hp-bar-temp" style="width:0%"></div>
            </div>
            <!-- Contrôles PV -->
            <div class="player-hp-controls">
              <button id="playerHpMinusBtn" class="player-hp-btn player-hp-btn--minus" type="button" title="−1 PV">−</button>
              <div class="player-hp-delta-wrap">
                <input id="playerHpDeltaInput" type="number" class="player-hp-delta-input" placeholder="Δ" title="Δ PV (négatif = dégâts, positif = soins)" />
                <button id="playerHpDeltaApplyBtn" class="player-hp-apply-btn" type="button">OK</button>
              </div>
              <button id="playerHpPlusBtn" class="player-hp-btn player-hp-btn--plus" type="button" title="+1 PV">+</button>
            </div>
          </div>

          <!-- Grille de stats -->
          <div class="player-stats-grid">
            <div class="player-stat-card">
              <div class="player-stat-label">CA</div>
              <div id="playerAcValue" class="player-stat-value">—</div>
            </div>
            <div class="player-stat-card">
              <div class="player-stat-label">Bonus CA</div>
              <input id="playerAcTempInput" type="number" class="player-stat-input" value="0" placeholder="0" title="Bonus CA temporaire" />
            </div>
            <div class="player-stat-card">
              <div class="player-stat-label">Initiative</div>
              <input id="playerInitiativeInput" type="number" class="player-stat-input" value="0" title="Initiative" />
            </div>
            <div class="player-stat-card">
              <div class="player-stat-label">PV Bonus</div>
              <input id="playerHpTempInput" type="number" class="player-stat-input" value="0" placeholder="0" title="PV temporaires" />
            </div>
          </div>

          <!-- États / conditions -->
          <div class="player-conditions-section">
            <div class="player-stat-label" style="margin-bottom:6px">États</div>
            <div id="playerConditionChips" class="player-conditions-chips">
              <!-- chips générés par player.js -->
            </div>
            <input id="playerConditionsInput" type="text" class="player-conditions-text" placeholder="État personnalisé..." />
          </div>
        </div>

        <!-- Ribbon toolbar (permanent, below canvas) -->
        <div id="mapToolbar" class="map-ribbon" role="toolbar" aria-label="Outils joueur">
          <div class="map-ribbon__main">
            <div class="map-ribbon__group">
              <button id="toolMeasure" class="map-ribbon__btn" type="button" title="Mesurer (clic-drag)">
                <svg class="ico" viewBox="0 0 24 24"><path d="M2 12h20M6 8v8M12 8v8M18 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="map-ribbon__label">Mesure</span>
              </button>
              <button id="toolPing" class="map-ribbon__btn" type="button" title="Ping (maintenir G + clic)">
                <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <span class="map-ribbon__label">Ping</span>
              </button>
              <button id="playerGridToggle" class="map-ribbon__btn map-ribbon__btn--toggle is-active" type="button" title="Grille" aria-pressed="true">
                <svg class="ico" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <span class="map-ribbon__label">Grille</span>
              </button>
            </div>

            <span class="map-ribbon__sep"></span>

            <div class="map-ribbon__grouped">
              <span class="map-ribbon__category">Sorts / Effets</span>
              <div class="map-ribbon__group" id="spellToolButtons">
                <button type="button" class="map-ribbon__btn" data-spell-tool="spell-cone" title="Cône">
                  <svg class="ico" viewBox="0 0 24 24"><path d="M12 4l-8 16h16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                  <span class="map-ribbon__label">Cône</span>
                </button>
                <button type="button" class="map-ribbon__btn" data-spell-tool="spell-sphere" title="Sphère">
                  <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/></svg>
                  <span class="map-ribbon__label">Sphère</span>
                </button>
                <button type="button" class="map-ribbon__btn" data-spell-tool="spell-line" title="Ligne">
                  <svg class="ico" viewBox="0 0 24 24"><path d="M4 20L20 4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                  <span class="map-ribbon__label">Ligne</span>
                </button>
                <button type="button" class="map-ribbon__btn" data-spell-tool="spell-cube" title="Cube">
                  <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/></svg>
                  <span class="map-ribbon__label">Cube</span>
                </button>
              </div>
            </div>

            <div class="map-ribbon__group">
              <label class="map-ribbon__color" title="Couleur du sort">
                <input id="spellColor" type="color" value="#f59e0b" />
              </label>
              <label class="map-ribbon__slider" title="Largeur ligne (cases)">
                <input id="spellLineWidth" type="range" min="0.5" max="6" step="0.5" value="1" />
                <span id="spellLineWidthValue" class="map-ribbon__val">1c</span>
              </label>
              <button id="undoSpellBtn" class="map-ribbon__btn" type="button" title="Annuler dernier sort">
                <svg class="ico" viewBox="0 0 24 24"><path d="M7 7H3V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 7a9 9 0 1 1 2.64 6.36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button id="clearSpellBtn" class="map-ribbon__btn map-ribbon__btn--danger" type="button" title="Effacer mes sorts">
                <svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>

            <span class="map-ribbon__sep"></span>

            <div class="map-ribbon__group">
              <label class="map-ribbon__slider" title="Zoom">
                <svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 8v6M8 11h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input id="playerZoomRange" type="range" min="0.2" max="5" step="0.01" value="1" />
                <span id="playerZoomValue" class="map-ribbon__val">100%</span>
              </label>
            </div>

            <span class="map-ribbon__sep"></span>

            <label class="map-ribbon__check" title="Suivre la caméra du MJ">
              <input id="followCamera" type="checkbox" checked />
              <span class="map-ribbon__label">Suivre MJ</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings below (collapsible) -->
    <details class="map-settings-panel" style="margin: 8px 16px 0;">
      <summary class="map-settings-summary">Paramètres</summary>
      <div class="map-settings-body">
        <div class="map-settings-row">
          <label class="field-inline"><span>Room</span><input id="rtRoom" type="text" style="width:120px" /></label>
          <button id="rtConnectBtn" class="secondary small" type="button">Reconnect</button>
        </div>
        <div class="map-settings-row">
          <label class="field-inline"><span>Nom (ping)</span><input id="pingName" type="text" placeholder="ex: Théo" style="width:120px" /></label>
          <label class="field-inline"><span>Couleur</span><input id="pingColor" type="color" value="#f59e0b" /></label>
        </div>
        <div class="map-settings-row">
          <div id="onlinePlayers" class="online-players-list">
            <span class="muted">—</span>
          </div>
        </div>
      </div>
    </details>
  </div>

  <script type="module" src="js/player.js"></script>
</body>
</html>
