<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battlemap — Joueur</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo">⚔️</div>
        <div>
          <div class="title">Battlemap — Joueur</div>
          <div class="subtitle">Vue temps réel. Par défaut tu suis la caméra du MJ.</div>
        </div>
      </div>
      <div class="pill-row">
        <span class="pill" id="rtStatusPill">Statut : <b id="rtStatus">…</b></span>
      </div>
    </header>

    <div class="content">
      <div class="panel map-canvas player-canvas">
        <div id="turnBar" class="turnbar" aria-label="Ordre des tours"></div>
        <div class="map-canvas-wrap">
          <canvas id="map"></canvas>
        </div>
        <div id="playerTokenPanel" class="map-settings-body" style="border-top:1px solid var(--border);">
          <div class="map-settings-row">
            <strong id="playerTokenName">Aucun token sélectionné</strong>
          </div>
          <div class="map-settings-row">
            <button id="playerHpMinusBtn" class="secondary small" type="button">-1 PV</button>
            <button id="playerHpPlusBtn" class="secondary small" type="button">+1 PV</button>
            <span id="playerHpValue" class="muted">PV: —</span>
          </div>
          <div class="map-settings-row">
            <label class="field-inline" style="flex:1">
              <span>États</span>
              <input id="playerConditionsInput" type="text" placeholder="Empoisonné, à terre..." style="width:100%" />
            </label>
          </div>
        </div>

        <!-- Ribbon toolbar (permanent, below canvas) -->
        <div id="mapToolbar" class="map-ribbon" role="toolbar" aria-label="Outils joueur">
          <div class="map-ribbon__main">
            <div class="map-ribbon__group">
              <button id="toolMeasure" class="map-ribbon__btn" type="button" title="Mesurer (clic-drag)">
                <svg class="ico" viewBox="0 0 24 24"><path d="M2 12h20M6 8v8M12 8v8M18 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="map-ribbon__label">Mesure</span>
              </button>
              <button id="toolPing" class="map-ribbon__btn" type="button" title="Ping (maintenir G + clic)">
                <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <span class="map-ribbon__label">Ping</span>
              </button>
              <button id="playerGridToggle" class="map-ribbon__btn map-ribbon__btn--toggle is-active" type="button" title="Grille" aria-pressed="true">
                <svg class="ico" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <span class="map-ribbon__label">Grille</span>
              </button>
            </div>

            <span class="map-ribbon__sep"></span>

            <div class="map-ribbon__group">
              <label class="map-ribbon__slider" title="Zoom">
                <svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 8v6M8 11h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input id="playerZoomRange" type="range" min="0.2" max="5" step="0.01" value="1" />
                <span id="playerZoomValue" class="map-ribbon__val">100%</span>
              </label>
            </div>

            <span class="map-ribbon__sep"></span>

            <label class="map-ribbon__check" title="Suivre la caméra du MJ">
              <input id="followCamera" type="checkbox" checked />
              <span class="map-ribbon__label">Suivre MJ</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings below (collapsible) -->
    <details class="map-settings-panel" style="margin: 8px 16px 0;">
      <summary class="map-settings-summary">Paramètres</summary>
      <div class="map-settings-body">
        <div class="map-settings-row">
          <label class="field-inline"><span>Room</span><input id="rtRoom" type="text" style="width:120px" /></label>
          <button id="rtConnectBtn" class="secondary small" type="button">Reconnect</button>
        </div>
        <div class="map-settings-row">
          <label class="field-inline"><span>Nom (ping)</span><input id="pingName" type="text" placeholder="ex: Théo" style="width:120px" /></label>
          <label class="field-inline"><span>Couleur</span><input id="pingColor" type="color" value="#f59e0b" /></label>
        </div>
        <div class="map-settings-row">
          <div id="onlinePlayers" class="online-players-list">
            <span class="muted">—</span>
          </div>
        </div>
      </div>
    </details>
  </div>

  <script type="module" src="js/player.js"></script>
</body>
</html>
